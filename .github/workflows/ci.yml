name: DataOps - CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Fetch main branch
        run: git fetch origin main:main 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p db

      - name: Run SQLMesh Unit Tests
        run: sqlmesh test

      - name: Run SQLMesh CI/CD Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import os, sys
          from sqlmesh.integrations.github.cicd.controller import Bot

          print('=== INICIANDO SQLMESH GITHUB BOT ===')
          
          # Instanciar e invocar el bot usando el token y la config local
          try:
              bot = Bot()
              bot.run()
              print('=== BOT EJECUTADO CON ÉXITO ===')
          except Exception as e:
              print(f'*** ERROR AL EJECUTAR EL BOT: {e} ***')
              import traceback
              traceback.print_exc()
              sys.exit(1)
          "