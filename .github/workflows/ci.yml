name: DataOps - CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Fetch main branch
        run: git fetch origin main:main 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p db

      - name: Run SQLMesh Unit Tests
        run: sqlmesh test

      - name: Run SQLMesh CI/CD Bot (Discovery Mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import sys, click, traceback
          import sqlmesh.integrations.github.cicd.command as cmd

          print('=== ANALIZANDO MÓDULO SQLMESH ===')
          
          # Buscamos dinámicamente cualquier objeto que sea un comando de Click
          cli_func = None
          for name in dir(cmd):
              obj = getattr(cmd, name)
              if isinstance(obj, click.Command) or isinstance(obj, click.Group):
                  cli_func = obj
                  print(f'[OK] Encontrada función CLI: {name}')
                  break
          
          if not cli_func:
              print('[ERROR] No se encontró ninguna función CLI. Atributos:', [a for a in dir(cmd) if not a.startswith('_')])
              sys.exit(1)

          print('=== EJECUTANDO CLI ===')
          # Le pasamos el argumento que Click espera encontrar nativamente
          sys.argv = ['sqlmesh_cicd'] 
          
          try:
              cli_func()
          except SystemExit as e:
              print(f'=== CLI FINALIZÓ CON CÓDIGO {e.code} ===')
              # Si Click imprime la ayuda por falta de argumentos, lo veremos acá
          except Exception as e:
              print(f'*** ERROR FATAL: {e} ***')
              traceback.print_exc()
              sys.exit(1)
          "