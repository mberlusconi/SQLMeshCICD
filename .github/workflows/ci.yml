name: DataOps - CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure DB directory exists
        run: mkdir -p db

      - name: Run Unit Tests
        run: sqlmesh test

      - name: Deploy to Isolated PR Environment
        run: sqlmesh plan pr_${{ github.event.number }} --skip-tests --auto-apply