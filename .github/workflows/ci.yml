name: DataOps - CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Fetch main branch
        run: git fetch origin main:main 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyGithub
          mkdir -p db

      - name: Run SQLMesh Unit Tests
        run: sqlmesh test

      - name: Build Baseline State from Main
        run: |
          git checkout -b estado_del_pr
          git checkout main
          sqlmesh plan --auto-apply
          git checkout estado_del_pr

      - name: Generate and Post SQLMesh Data Diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > post_diff.py
          import os, subprocess, json
          from github import Github
          from github import Auth

          print("=== GENERATING SQLMESH DIFF ===")
          
          result = subprocess.run(
              ["sqlmesh", "diff", "prod"],
              capture_output=True,
              text=True
          )
          
          diff_output = result.stdout.strip()
          
          if not diff_output and result.returncode != 0:
              diff_output = f"Internal SQLMesh Error:\n{result.stderr}"

          event_path = os.getenv("GITHUB_EVENT_PATH")
          with open(event_path, "r") as f:
              event_data = json.load(f)

          if "pull_request" not in event_data:
              print("This workflow was not triggered by a Pull Request.")
              exit(0)

          pr_number = event_data["pull_request"]["number"]
          repo_name = event_data["repository"]["full_name"]

          print(f"Posting comment to PR #{pr_number}...")

          auth = Auth.Token(os.getenv("GITHUB_TOKEN"))
          g = Github(auth=auth)
          repo = g.get_repo(repo_name)
          pr = repo.get_pull(pr_number)

          comment_body = f"""## 📊 SQLMesh Impact Report
          
          Evaluation of proposed changes against the production environment (`prod`):
          
          ```diff
          {diff_output if diff_output else "No semantic or structural differences detected."}
          ```
          """

          existing_comments = pr.get_issue_comments()
          target_comment = None
          for comment in existing_comments:
              if "## 📊 SQLMesh Impact Report" in comment.body:
                  target_comment = comment
                  break

          if target_comment:
              target_comment.edit(comment_body)
              print("Existing comment updated successfully.")
          else:
              pr.create_issue_comment(comment_body)
              print("New comment created successfully.")
          EOF
          
          python post_diff.py