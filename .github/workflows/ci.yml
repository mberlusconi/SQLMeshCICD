name: DataOps - CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Fetch main branch
        run: git fetch origin main:main 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyGithub
          mkdir -p db

      - name: Run SQLMesh Unit Tests
        run: sqlmesh test

      - name: Build Baseline State from Main
        run: |
          # 1. Guardamos los cambios del PR en una rama temporal segura
          git checkout -b estado_del_pr
          
          # 2. Nos movemos a main y registramos el estado base en DuckDB (entorno prod)
          git checkout main
          sqlmesh plan --auto-apply
          
          # 3. Volvemos a los cambios del PR
          git checkout estado_del_pr

      - name: Generate and Post SQLMesh Data Diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > post_diff.py
          import os, subprocess, json
          from github import Github
          from github import Auth

          print('=== GENERANDO SQLMESH DIFF ===')
          
          diff_output = ''
          try:
              # SQLMesh evalúa los cambios de la rama actual contra el entorno base 'prod'
              result = subprocess.run(
                  ['sqlmesh', 'diff', 'prod'],
                  capture_output=True,
                  text=True,
                  check=True
              )
              diff_output = result.stdout
              print('Diff ejecutado exitosamente.')
          except subprocess.CalledProcessError as e:
              diff_output = f'STDOUT:\n{e.stdout}\n\nSTDERR:\n{e.stderr}'
              print('Error al ejecutar el comando diff.')

          event_path = os.getenv('GITHUB_EVENT_PATH')
          with open(event_path, 'r') as f:
              event_data = json.load(f)

          if 'pull_request' not in event_data:
              print('Este workflow no se disparó en un Pull Request.')
              exit(0)

          pr_number = event_data['pull_request']['number']
          repo_name = event_data['repository']['full_name']

          print(f'Publicando comentario en el PR #{pr_number}...')

          # Autenticación actualizada para evitar el DeprecationWarning
          auth = Auth.Token(os.getenv('GITHUB_TOKEN'))
          g = Github(auth=auth)
          repo = g.get_repo(repo_name)
          pr = repo.get_pull(pr_number)

          comment_body = f"""## 📊 Reporte de Impacto SQLMesh
          
          Evaluación de los cambios propuestos contra el entorno de producción (`prod`):
          
          ```text
          {diff_output if diff_output.strip() else 'No se detectaron diferencias semánticas ni de estructura.'}
          ```
          """

          existing_comments = pr.get_issue_comments()
          target_comment = None
          for comment in existing_comments:
              if '## 📊 Reporte de Impacto SQLMesh' in comment.body:
                  target_comment = comment
                  break

          if target_comment:
              target_comment.edit(comment_body)
              print('Comentario existente actualizado.')
          else:
              pr.create_issue_comment(comment_body)
              print('Nuevo comentario creado exitosamente.')
          EOF
          
          python post_diff.py