name: DataOps CI Pipeline

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  

jobs:
  dataops-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure DB directory exists
        run: mkdir -p db      

      - name: Run SQLMesh Unit Tests
        run: |
          sqlmesh test --auto-apply

      - name: Validate SQLMesh Models Plan
        run: |
          sqlmesh plan --skip-tests 