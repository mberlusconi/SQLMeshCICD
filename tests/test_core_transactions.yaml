test_currency_normalization:
  model: demo.core_transactions
  vars:
    start_date: "2026-08-22"
    end_date: "2026-08-22"
  inputs:
    demo.stg_transactions:
      - transaction_id: 101
        customer_id: "CUST_1"
        transaction_date: "2026-08-22"
        amount: 150.50
        currency: "USD"
      - transaction_id: 102
        customer_id: "CUST_2"
        transaction_date: "2026-08-22"
        amount: 200.00
        currency: "USD"
  outputs:
    query:
      - transaction_id: 101
        customer_id: "CUST_1"
        transaction_date: "2026-08-22"
        amount: 150.50
        currency: "USD"
        ticket_segment: "MEDIUM"
      - transaction_id: 102
        customer_id: "CUST_2"
        transaction_date: "2026-08-22"
        amount: 200.00
        currency: "USD"
        ticket_segment: "MEDIUM"